<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Create Short URL</h1>

<form id="shortenFrom" >

    <label>
        Original URL:
    </label>

    <input 
        type="text" 
        name="originalUrl" 
        placeholder="Enter long URL" required
    >

    <br><br>

    <label>
        Short Code:
    </label>

    <input 
        type="text" 
        name="shortCode" 
        placeholder="Enter custom name" required
    >

    <br><br>

    <button type="submit">
        Create Short URL
    </button>
    
    <div class="result"></div>

</form>

<script src="/script.js"></script>
</body>
</html>
